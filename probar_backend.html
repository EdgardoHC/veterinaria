<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Test Backend - Veterinaria</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <div class="jumbotron py-4">
      <h1>🛠️ Panel de Pruebas de Backend (Equipo 2)</h1>
      <p>
        Este panel simula al Frontend para verificar que tus controladores
        funcionen.
      </p>
    </div>

    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5>Test 1: Área de Trabajo (Controller)</h5>
      </div>
      <div class="card-body">
        <div class="btn-group">
          <button class="btn btn-success" onclick="testArea('guardar')">
            💾 Guardar 'Área Test'
          </button>
          <button class="btn btn-info" onclick="testArea('listar')">
            📋 Listar Áreas
          </button>
        </div>
        <hr />
        <strong>Respuesta del Servidor:</strong>
        <pre id="resultadoArea" class="bg-dark text-warning p-3 border rounded">
Esperando acción...</pre
        >
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-success text-white">
        <h5>Test 2: Puesto de Trabajo (Controller)</h5>
      </div>
      <div class="card-body">
        <div class="btn-group">
          <button class="btn btn-warning" onclick="testPuesto('guardar')">
            💾 Guardar 'Puesto Test' (en Clínica)
          </button>
          <button class="btn btn-info" onclick="testPuesto('listar')">
            📋 Listar Puestos
          </button>
        </div>
        <hr />
        <strong>Respuesta del Servidor:</strong>
        <pre
          id="resultadoPuesto"
          class="bg-dark text-warning p-3 border rounded"
        >
Esperando acción...</pre
        >
      </div>
    </div>

    <script>
      // --- FUNCIÓN PARA PROBAR ÁREA ---
      function testArea(accion) {
        let datos = { accion: accion };
        if (accion === "guardar") {
          datos.nombre = "Área Test " + Math.floor(Math.random() * 1000);
        }

        $.post(
          "controller/AreaTrabajoController.php",
          datos,
          function (response) {
            console.log("Respuesta Área:", response);
            $("#resultadoArea").html(JSON.stringify(response, null, 4));
          },
          "json"
        ).fail(function (xhr, status, error) {
          $("#resultadoArea").html("Error de conexión: " + xhr.responseText);
        });
      }

      // --- FUNCIÓN PARA PROBAR PUESTO ---
      function testPuesto(accion) {
        let datos = { accion: accion };
        if (accion === "guardar") {
          datos.nombre = "Puesto Test " + Math.floor(Math.random() * 1000);
          datos.idAreaTrabajo = 1; // Usamos el ID 1 que existe en tu BD (Clínica)
        }

        $.post(
          "controller/PuestoTrabajoController.php",
          datos,
          function (response) {
            console.log("Respuesta Puesto:", response);
            $("#resultadoPuesto").html(JSON.stringify(response, null, 4));
          },
          "json"
        ).fail(function (xhr, status, error) {
          $("#resultadoPuesto").html("Error de conexión: " + xhr.responseText);
        });
      }
    </script>
  </body>
</html>
